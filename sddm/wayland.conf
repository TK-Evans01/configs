# /etc/sddm.conf.d/wayland.conf — installed by `install.sh wayland`
# Greeter on weston (kiosk shell) instead of Xorg: nothing of the login
# screen keeps running after you log in. Undo from a TTY (Ctrl+Alt+F3):
#   sudo rm /etc/sddm.conf.d/wayland.conf && sudo systemctl restart sddm
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=weston --shell=kiosk
