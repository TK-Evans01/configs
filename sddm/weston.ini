# /etc/sddm/weston.ini — weston config for the SDDM greeter (install.sh wayland).
# The kiosk shell shows the greeter on a single output, so DP-3 mirrors DP-2
# and the login screen appears on both monitors.
[core]
shell=kiosk-shell.so
idle-time=0

[output]
name=DP-2

[output]
name=DP-3
same-as=DP-2
