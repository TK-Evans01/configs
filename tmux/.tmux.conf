# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Base
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'hasundue/tmux-gruvbox-material'

set -g @gruvbox-material_theme 'dark'
set -g @gruvbox-material_contrast 'medium'

# Sessions survive reboots: resurrect saves/restores windows, panes, working
# dirs and pane contents; continuum saves every 15 min and restores when the
# tmux server starts. Continuum must stay the LAST plugin (a theme loaded
# after it overwrites status-right, which drives the autosave).
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'spotify_player'   # + the default list (nvim, vim, less, htop, ...)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
