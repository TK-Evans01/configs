# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features ",xterm-ghostty:RGB"

# Images in yazi etc. (kitty graphics protocol through tmux)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Base
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Colours + status line come from the rice shell's theme (theme-apply.py
# writes ~/.local/state/rice/theme/tmux.conf and re-sources it live). These
# defaults (gruvbox-material) cover a fresh install before the shell runs.
set -g @rice_bar "#32302f"
set -g @rice_block "#45403d"
set -g @rice_text "#d4be98"
set -g @rice_sub "#a89984"
set -g @rice_accent "#d8a657"
set -g @rice_rev "#1d2021"
set -g @rice_capl ""
set -g @rice_capr ""
set -g status-style "fg=#d4be98,bg=#32302f"
source-file -q ~/.local/state/rice/theme/tmux.conf
set -g status-left-length 100
set -g status-right-length 100
# Reads the theme's options, so a theme switch never rewrites it (continuum
# appends its autosave hook to this line when it loads).
set -g status-right "#[fg=#{@rice_block},bg=#{@rice_bar}]#{@rice_capl}#[fg=#{@rice_text},bg=#{@rice_block}] %Y-%m-%d  %H:%M #[fg=#{@rice_accent},bg=#{@rice_block}]#{@rice_capl}#[fg=#{@rice_rev},bg=#{@rice_accent},bold] #h #[fg=#{@rice_accent},bg=#{@rice_bar},nobold]#{@rice_capr}"

# Sessions survive reboots: resurrect saves/restores windows, panes, working
# dirs and pane contents; continuum saves every 15 min and restores when the
# tmux server starts. Continuum must stay the LAST plugin (anything that sets
# status-right after it drops the autosave hook).
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
# (spotify_player runs as a daemon from Hyprland; its TUI is not restored)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
